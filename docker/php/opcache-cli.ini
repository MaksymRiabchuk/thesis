; php artisan serve runs under the CLI SAPI, where opcache.enable_cli defaults
; to Off — meaning every request recompiles all of Laravel + vendor from
; source instead of reusing cached bytecode. Enabling it here cuts boot cost.
;
; revalidate_freq=2 (not 0): with validate_timestamps on, opcache stat()s
; every cached file on every request to check for changes. On a Windows bind
; mount each stat() crosses into the host filesystem and is noticeably slow,
; and Laravel's boot alone touches several hundred files — so revalidating
; on every single request was costing ~800ms of pure stat() overhead before
; a single line of app code ran. Capping revalidation to once per 2s keeps
; edits picked up almost immediately while skipping that storm on repeated
; requests within the window.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
